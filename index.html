<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>เส้นทางนักเทคโนโลยีสุขภาพ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#eef7f5;--teal:#0f8a74;--teal-d:#085041;--coral:#e0653a;--ink:#1d2b2a;--muted:#5f6f6c;--green:#2e9e5b;--red:#d64545;--cw:min(17vw,30vh)}
@media (orientation:portrait){:root{--cw:min(28vw,17vh)}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Prompt',sans-serif;background:var(--bg);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
.screen{position:fixed;left:var(--ax,0px);top:var(--ay,0px);width:var(--aw,100vw);height:var(--ah,100dvh);display:none;flex-direction:column;align-items:center;justify-content:center;padding:2vmin 3vmin;gap:2.4vmin;overflow:hidden}
.screen.active{display:flex}
h1{font-size:clamp(28px,8vmin,80px);font-weight:600;color:var(--teal-d);text-align:center;line-height:1.2}
.sub{font-size:clamp(14px,3vmin,30px);color:var(--muted);text-align:center}
.btn{font-family:inherit;font-size:clamp(16px,3.6vmin,34px);font-weight:500;padding:.55em 1.3em;border-radius:999px;border:3px solid var(--teal);background:#fff;color:var(--teal-d);cursor:pointer;transition:transform .15s,background .15s;min-height:44px}
.btn.primary{background:var(--teal);color:#fff}
.btn:hover,.btn.hover{transform:scale(1.07);background:#d9f2ec}
.btn.primary:hover,.btn.primary.hover{background:#0b6e5c}
.row{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center}
.howto{display:flex;flex-wrap:wrap;justify-content:center;gap:2vmin;font-size:clamp(13px,2.6vmin,24px);color:var(--muted);text-align:center}
.howto div{background:#fff;border-radius:18px;padding:1.6vmin 2.4vmin;border:2px solid #cfe5df}
.howto b{display:block;font-size:clamp(26px,6vmin,56px)}
#status{font-size:clamp(13px,2.2vmin,20px);color:var(--muted);min-height:1.5em;text-align:center}
#cursor{position:fixed;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:5px solid var(--coral);background:rgba(224,101,58,.15);pointer-events:none;z-index:9999;display:none}
#cursor.pinch{width:30px;height:30px;margin:-15px 0 0 -15px;background:var(--coral)}
#cam{position:fixed;right:8px;bottom:8px;width:clamp(90px,20vmin,190px);border-radius:10px;transform:scaleX(-1);border:3px solid #fff;z-index:50;display:none;opacity:.85;pointer-events:none}
#handPill{position:fixed;right:8px;top:8px;z-index:60;font-size:13px;padding:3px 10px;border-radius:999px;background:#fff;border:2px solid #cfe5df;display:none;pointer-events:none}
#boardScreen{padding:1vmin}
#board{position:relative;width:100%;height:100%}
.sq{position:absolute;padding:.6vmin}
.sq .in{width:100%;height:100%;border-radius:1.8vmin;background:#fff;border:2px solid #cfe5df;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:clamp(10px,2.1vmin,19px);line-height:1.2;padding:3px;overflow:hidden}
.sq .in .em{font-size:clamp(16px,4.6vmin,42px);opacity:.35}
.sq .in small{font-size:.8em}
.sq.station .in{color:#fff;border:none}
.sq.station .in .em{opacity:1}
.sq.locked .in{background:#d8dedc!important;color:#7a8583}
.sq.done .in{opacity:.5}
.sq.start .in{background:#fff4d6;border-color:#f2c46b}
#token{position:absolute;width:clamp(28px,6vmin,60px);height:clamp(28px,6vmin,60px);border-radius:50%;background:var(--coral);border:4px solid #fff;transform:translate(-50%,-50%);transition:left .22s,top .22s;z-index:5;box-shadow:0 4px 10px rgba(0,0,0,.25)}
#center{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vmin;text-align:center;padding:2vmin}
#center h2{font-size:clamp(20px,5vmin,46px);color:var(--teal-d);font-weight:600}
#dice{width:clamp(70px,15vmin,150px);height:clamp(70px,15vmin,150px);background:#fff;border-radius:20%;border:5px solid var(--ink);font-size:clamp(42px,10vmin,100px);font-weight:600;display:flex;align-items:center;justify-content:center}
#dice.roll{animation:wob .14s infinite}
@keyframes wob{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}100%{transform:rotate(-12deg)}}
#progress{font-size:clamp(13px,2.6vmin,24px);color:var(--muted)}
#station{justify-content:flex-start;padding-top:2vmin}
.sthead{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:1vmin 2.4vmin;font-size:clamp(15px,3.2vmin,32px);font-weight:500;flex:none}
.sthead .nm{color:var(--teal-d)}
.timebar{flex:1;min-width:120px;height:clamp(12px,2.4vmin,20px);background:#d5e6e2;border-radius:10px;overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:var(--teal);transition:width .1s linear}
@media (orientation:portrait){.sthead .nm{width:100%}}
#stbody{position:relative;flex:1;min-height:0;width:100%;display:flex;flex-direction:column;gap:2vmin}
.drop{transition:background .15s,border-color .15s}
.drop.over{border-color:var(--coral)!important;background:#fff1ea!important}
.pz{flex:none;margin:1vmin auto 0;width:min(94vw,900px);background:#fff;border:5px dashed #9fd3c7;border-radius:4vmin;display:flex;align-items:center;gap:3vmin;padding:2.6vmin 3.4vmin}
.pz .em{font-size:clamp(48px,13vmin,130px);flex:none}
.pz small{display:block;font-size:clamp(12px,2.4vmin,22px);color:var(--muted)}
.pz .txt{font-size:clamp(17px,4vmin,40px);font-weight:500;line-height:1.3}
.pz.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
.tray{flex:1;min-height:0;display:flex;flex-wrap:nowrap;justify-content:center;align-content:center;align-items:center;gap:1.8vmin}
@media (orientation:portrait){.tray{flex-wrap:wrap;max-width:calc(var(--cw)*3 + 4vmin);margin:0 auto}}
.card{width:var(--cw);height:calc(var(--cw)*1.1);background:#fff;border-radius:2.6vmin;border:3px solid #cfe5df;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:clamp(11px,calc(var(--cw)*.105),22px);line-height:1.2;padding:6px;cursor:grab;transition:transform .25s,border-color .15s;position:relative;flex:none}
.card .em{font-size:calc(var(--cw)*.4);line-height:1.15}
.card.hover{border-color:var(--teal)}
.card.dragging{transition:none;z-index:100;border-color:var(--coral);box-shadow:0 12px 30px rgba(0,0,0,.22);cursor:grabbing}
#itemArea{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.card.item{width:min(92vw,680px);height:auto;min-height:20vmin;align-items:flex-start;text-align:left;padding:2.4vmin 3vmin;gap:1vmin;font-size:clamp(16px,3.6vmin,34px)}
@media (orientation:landscape){.card.item{width:min(60vw,680px)}}
.item .from{font-size:clamp(12px,2.2vmin,20px);color:var(--muted)}
.item .em{font-size:clamp(30px,7vmin,60px)}
.item.pop{animation:pop .3s}
@keyframes pop{from{opacity:0}to{opacity:1}}
.bins{flex:none;display:flex;justify-content:space-between;gap:3vmin;padding-bottom:1vmin}
.bin{flex:1;height:min(30vh,48vw);border-radius:4vmin;border:5px dashed;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(15px,3.6vmin,38px);font-weight:500;text-align:center;padding:1vmin}
@media (orientation:portrait){.bin{height:min(24vh,44vw)}}
.bin .em{font-size:clamp(36px,9vmin,90px)}
.bin.safe{border-color:#7cc79a;background:#eaf7ef;color:#1e6b3e}
.bin.danger{border-color:#e89a9a;background:#fcebeb;color:#8f2a2a}
#fb{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.8);width:max-content;max-width:90vw;padding:1.6vmin 3vmin;border-radius:3vmin;font-size:clamp(16px,3.4vmin,34px);font-weight:500;text-align:center;color:#fff;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:150}
#fb.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#fb.good{background:var(--green)}#fb.bad{background:var(--red)}
.overlay{position:absolute;inset:0;background:rgba(238,247,245,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vmin;z-index:200;text-align:center;padding:0 6vmin}
.overlay .big{font-size:clamp(50px,14vmin,140px)}
.overlay h2{font-size:clamp(24px,6vmin,60px);color:var(--teal-d)}
.overlay p{font-size:clamp(15px,3.2vmin,30px);color:var(--muted);max-width:900px}
.tag{display:inline-block;background:#d9f2ec;color:var(--teal-d);border-radius:999px;padding:.2em 1em;font-size:clamp(12px,2.4vmin,24px)}
#summary{gap:1.8vmin}
#summary .wrap{display:flex;gap:4vmin;align-items:center;justify-content:center}
@media (orientation:portrait){#summary .wrap{flex-direction:column;gap:2vmin}}
.career{background:#fff;border-radius:4vmin;border:3px solid #cfe5df;padding:2.6vmin 4vmin;width:min(92vw,720px);text-align:center;display:flex;flex-direction:column;gap:1.2vmin;align-items:center}
.career .em{font-size:clamp(44px,11vmin,120px);line-height:1.1}
.career h2{font-size:clamp(20px,5vmin,50px);color:var(--teal-d)}
.career p{font-size:clamp(13px,2.8vmin,26px);color:var(--muted)}
.scoreList{font-size:clamp(12px,2.4vmin,22px);color:var(--ink)}
.qrbox{background:#fff;border-radius:4vmin;padding:2vmin 3vmin;text-align:center;font-size:clamp(12px,2.4vmin,22px);display:flex;flex-direction:column;align-items:center;gap:1vmin}
#total{font-size:clamp(36px,10vmin,90px);font-weight:600;color:var(--coral);line-height:1.1}
.card.fix .em{font-size:calc(var(--cw)*.26)}
.card.fix{font-size:clamp(11px,calc(var(--cw)*.1),21px)}
@media (orientation:portrait){.tray.t4{max-width:calc(var(--cw)*2 + 3vmin)}}
.iotbox{flex-direction:column;align-items:stretch;gap:2vmin}
.iothead{font-size:clamp(15px,3.4vmin,32px);font-weight:500;text-align:center}
.pipe{display:flex;align-items:center;justify-content:center;gap:1vmin;flex-wrap:wrap}
.slot{width:clamp(70px,17vmin,160px);min-height:clamp(70px,15vmin,140px);border:3px dashed #b9c9c5;border-radius:2vmin;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:clamp(11px,2.2vmin,20px);color:var(--muted);padding:4px;line-height:1.2}
.slot small{font-size:.85em}
.slot.active{border-color:#534ab7;background:#eeedfe;color:#3c3489}
.slot.filled{border-style:solid;border-color:#5dcaa5;background:#e1f5ee;color:#085041}
.slot .em{font-size:clamp(22px,5vmin,48px)}
.arrow{font-size:clamp(14px,3vmin,28px);color:var(--muted)}
@media (orientation:portrait){.arrow{display:none}.pipe{display:grid;grid-template-columns:repeat(2,auto);justify-content:center}}
.bins.three{gap:2vmin}
.bin.folder{border-color:#85b7eb;background:#e6f1fb;color:#0c447c;font-size:clamp(13px,3vmin,32px)}
.dash{background:#fff;border-radius:3vmin;border:2px solid #cfe5df;padding:2vmin 3vmin;width:min(92vw,900px)}
.dtitle{font-weight:500;color:var(--teal-d);font-size:clamp(14px,2.8vmin,26px);margin-bottom:1vmin}
.dcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2vmin;text-align:left}
.dcol{display:flex;flex-direction:column;gap:.5vmin;font-size:clamp(11px,2vmin,18px);color:var(--ink)}
.dcol b{font-weight:500;color:#0c447c}
.sq .in .ico{display:block;width:clamp(22px,6vmin,54px);height:clamp(22px,6vmin,54px)}
.sq .in .ico.deco{width:clamp(18px,4.6vmin,40px);height:clamp(18px,4.6vmin,40px);opacity:.85}
.sq .in .ico svg,.badge svg,.art svg,#token svg{width:100%;height:100%;display:block}
.sq:not(.station):not(.start) .in{background:#fff8ea;border-color:#f2dcb0}
.sq.station .in{box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
#boardScreen{background:#e3f4ea}
#token{background:#fff;border:4px solid var(--coral);overflow:hidden;width:clamp(36px,8vmin,72px);height:clamp(36px,8vmin,72px)}
#token.hop{animation:hop .22s}
@keyframes hop{50%{margin-top:-1.6vmin}}
.hosp{position:absolute;left:4%;right:4%;bottom:2%;height:42%;opacity:.95;z-index:0;pointer-events:none}
.hosp svg{width:100%;height:100%}
#center>*:not(.hosp){position:relative;z-index:1}
#center{justify-content:flex-start;padding-top:4%}
#dice{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:clamp(9px,2vmin,20px);gap:clamp(4px,.9vmin,9px);box-shadow:inset 0 -6px 0 #d3d1c7}
#dice b{grid-column:1/4;grid-row:1/4;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,9vmin,90px)}
#dice{align-items:stretch;justify-items:stretch}
#dice i{border-radius:50%}
@media (orientation:landscape){.hosp{left:2%;right:auto;width:26%;top:8%;bottom:8%;height:auto}}
#dice i.on{background:var(--ink)}
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;vertical-align:middle}
.badge.sm{width:1.6em;height:1.6em;padding:.28em}
.badge.big{width:clamp(80px,18vmin,150px);height:clamp(80px,18vmin,150px);padding:3.6vmin;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.art{display:block;flex:none}
.card .art{width:calc(var(--cw)*.58);height:calc(var(--cw)*.58);margin-bottom:.3em}
.pz .art.pat{width:clamp(70px,17vmin,150px);height:clamp(70px,17vmin,150px)}
.art img{width:100%;height:100%;object-fit:contain;display:block}
.pz .art.pat svg{border-radius:2.4vmin}
#token{background:#ffe3ec}
.conf{position:fixed;width:12px;height:16px;border-radius:3px;z-index:300;pointer-events:none;animation:conf 1.2s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),calc(var(--dy) + 60vh)) rotate(var(--r));opacity:0}}
</style>
</head>
<body>

<video id="cam" playsinline muted></video>
<div id="cursor"></div>
<div id="handPill">ไม่เห็นมือ</div>

<section id="start" class="screen active">
  <h1>เส้นทางนักเทคโนโลยีสุขภาพ</h1>
  <p class="sub" id="progName"></p>
  <div class="howto">
    <div><b>🤏</b>จีบนิ้วโป้งกับนิ้วชี้<br>= หยิบ / กดปุ่ม</div>
    <div><b>✋</b>แยกนิ้วออก<br>= วาง</div>
    <div><b>🎲</b>ทอยเต๋า เดินไป<br>ผ่านภารกิจแต่ละสถานี</div>
  </div>
  <div class="row" id="startBtns">
    <button class="btn primary" id="btnCam">🖐️ เล่นด้วยมือ (เปิดกล้อง)</button>
    <button class="btn" id="btnMouse">🖱️ เล่นด้วยเมาส์ / แตะจอ</button>
  </div>
  <div class="row" id="readyBtns" style="display:none">
    <button class="btn primary" id="btnGo">เริ่มเกม</button>
  </div>
  <div id="status"></div>
</section>

<section id="boardScreen" class="screen">
  <div id="board">
    <div id="center">
      <div class="hosp" id="hosp"></div>
      <h2>ทอยเต๋าเลย!</h2>
      <div id="dice"><b>?</b></div>
      <button class="btn primary" id="btnRoll">🎲 ทอยลูกเต๋า</button>
      <div id="progress"></div>
    </div>
    <div id="token"></div>
  </div>
</section>

<section id="station" class="screen">
  <div class="sthead">
    <span class="nm" id="stName"></span>
    <div class="timebar"><i id="timeFill"></i></div>
    <span id="stTime">40</span>
    <span>คะแนน <span id="stScore">0</span></span>
  </div>
  <div id="stbody"></div>
  <div id="fb"></div>
</section>

<section id="summary" class="screen">
  <div class="sub">คะแนนรวมของคุณ</div>
  <div id="total">0</div>
  <div class="wrap">
    <div class="career" id="careerCard"></div>
    <div class="qrbox">
      <div id="qr"></div>
      <div>สนใจเรียนสายนี้?<br>สแกนดูหลักสูตรเลย</div>
    </div>
  </div>
  <div class="row">
    <button class="btn primary" id="btnAgain">เล่นใหม่</button>
  </div>
  <div class="sub" id="resetIn" style="font-size:clamp(13px,1.3vw,18px)"></div>
</section>

<script src="art.js"></script>
<script src="chibi.js"></script>
<script>
/* ===== ตั้งค่า (แก้ได้) ===== */
const CONFIG = {
  programName: 'หลักสูตรเทคโนโลยีสุขภาพ',
  faculty: 'คณะวิทยาศาสตร์และเทคโนโลยี',
  university: 'มหาวิทยาลัยราชภัฏบ้านสมเด็จเจ้าพระยา',
  applyUrl: 'https://www.bsru.ac.th/',   // ลิงก์หน้าหลักสูตร / รับสมัคร ที่จะขึ้นเป็น QR
  stationsPerGame: 3,                     // จำนวนสถานีต่อเกม
  stationTime: 40,                        // วินาทีต่อสถานี
  idleReset: 30                           // วินาทีที่หน้าสรุปก่อนกลับหน้าแรก
};

/* ===== สถานีบนกระดาน ===== */
const STATIONS = [
  {id:'device', sq:2,  name:'ห้องเครื่องมือแพทย์', subject:'วิชาเครื่องมือแพทย์', icon:'🩺', color:'#0f8a74', ready:true,
   how:'ผู้ป่วยมาพร้อมอาการ หยิบเครื่องมือแพทย์ที่เหมาะสมไปวางที่ผู้ป่วย',
   career:'สายผู้เชี่ยวชาญเครื่องมือแพทย์', careerDesc:'คุณเลือกเครื่องมือได้แม่นยำ เหมาะกับงานดูแลและบริหารเครื่องมือแพทย์ในโรงพยาบาลหรือบริษัทเครื่องมือแพทย์'},
  {id:'repair', sq:6,  name:'ศูนย์ซ่อมบำรุง', subject:'การจัดการเครื่องมือแพทย์', icon:'🔧', color:'#d85a30', ready:true,
   how:'เครื่องมือแพทย์ขึ้นแจ้งเตือน หยิบวิธีแก้ที่ถูกต้องไปวางที่เครื่อง',
   career:'สายช่างเทคนิคเครื่องมือแพทย์', careerDesc:'คุณวิเคราะห์อาการเสียได้ดี เหมาะกับงานซ่อมบำรุงและตรวจความพร้อมของเครื่องมือแพทย์ในโรงพยาบาล'},

/* ===== ระบบลากวาง (ใช้ร่วมกันทั้งมือและเมาส์) ===== */
let drag = null, onDrop = null;
function pointerDown(x,y,src){
  const el = document.elementFromPoint(x,y); if(!el) return;
  const d = el.closest('[data-drag]');
  if(d && onDrop){ drag = {el:d, sx:x, sy:y}; d.classList.add('dragging'); return; }
  if(src==='hand'){ const b = el.closest('.btn'); if(b && b.offsetParent) b.click(); }
}
function zoneAt(el){
  const r = el.getBoundingClientRect(), cx = r.left+r.width/2, cy = r.top+r.height/2;
  for(const z of document.querySelectorAll('.screen.active .drop')){
    const q = z.getBoundingClientRect();
    if(cx>=q.left && cx<=q.right && cy>=q.top && cy<=q.bottom) return z;
  }
  return null;
}
function pointerMove(x,y){
  if(!drag) return;
  drag.el.style.transform = `translate(${x-drag.sx}px,${y-drag.sy}px) scale(1.06)`;
  const z = zoneAt(drag.el);
  document.querySelectorAll('.drop').forEach(d=>d.classList.toggle('over', d===z));
}
function pointerUp(){
  if(!drag) return;
  const el = drag.el; drag = null; el.classList.remove('dragging');
  const z = zoneAt(el);
  document.querySelectorAll('.drop').forEach(d=>d.classList.remove('over'));
  const used = (z && onDrop) ? onDrop(el,z) : false;
  if(!used) el.style.transform = '';
}
function cancelDrag(){ if(drag){ drag.el.classList.remove('dragging'); drag.el.style.transform=''; drag=null; } }

window.addEventListener('pointerdown', e=>pointerDown(e.clientX,e.clientY,'mouse'));
window.addEventListener('pointermove', e=>pointerMove(e.clientX,e.clientY));
window.addEventListener('pointerup', ()=>pointerUp());
window.addEventListener('keydown', e=>{ if(e.key==='Escape') resetToStart(); });

    const fs = await FilesetResolver.forVisionTasks(V + '/wasm');
    const opts = d => ({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:d}, runningMode:'VIDEO', numHands:1});
    try{ landmarker = await HandLandmarker.createFromOptions(fs, opts('GPU')); }
    catch(e){ landmarker = await HandLandmarker.createFromOptions(fs, opts('CPU')); }
    $('status').textContent = 'กรุณากดอนุญาตให้ใช้กล้อง';
    const stream = await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}});
    video.srcObject = stream; await video.play();
    video.style.display = 'block'; pill.style.display = 'block';
    camReady = true;
    $('status').textContent = 'พร้อมแล้ว! ยกมือให้เห็นวงกลมสีส้ม แล้วจีบนิ้วที่ปุ่ม "เริ่มเกม"';
    $('startBtns').style.display = 'none'; $('readyBtns').style.display = 'flex';
    requestAnimationFrame(handLoop);
  }catch(err){
    console.error(err);
    $('btnCam').disabled = false;
    $('status').textContent = 'เปิดกล้องไม่สำเร็จ (ต้องเปิดผ่าน https และอนุญาตกล้อง) ลองเล่นด้วยเมาส์ได้เลย';
  }
}
let lastT = -1, sm = {x:innerWidth/2, y:innerHeight/2}, pinched = false, lostAt = 0, hoverEl = null;
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function handLoop(){
  if(video.readyState >= 2 && video.currentTime !== lastT){
    lastT = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());
    if(res.landmarks && res.landmarks.length){
      const lm = res.landmarks[0];
      const mx = (lm[4].x + lm[8].x)/2, my = (lm[4].y + lm[8].y)/2;
      const mxg = VP.h > VP.w ? 0.25 : 0.15;
      const tx = VP.x + clamp((1 - mx - mxg)/(1 - 2*mxg), 0, 1) * VP.w;
      const ty = VP.y + clamp((my - 0.12)/0.6, 0, 1) * VP.h;
      sm.x += (tx - sm.x)*0.45; sm.y += (ty - sm.y)*0.45;
      cursor.style.display = 'block';
      cursor.style.left = sm.x + 'px'; cursor.style.top = sm.y + 'px';
      pill.textContent = '✋ เห็นมือแล้ว';
      const d = dist(lm[4], lm[8]) / (dist(lm[0], lm[9]) || 1);
      if(!pinched && d < 0.33){ pinched = true; cursor.classList.add('pinch'); pointerDown(sm.x, sm.y, 'hand'); }
      else if(pinched && d > 0.5){ pinched = false; cursor.classList.remove('pinch'); pointerUp(); }
      pointerMove(sm.x, sm.y);
      updateHover(sm.x, sm.y);
      lostAt = 0;
    }else{
      if(!lostAt) lostAt = performance.now();
      else if(performance.now() - lostAt > 400){
        if(pinched){ pinched = false; cursor.classList.remove('pinch'); pointerUp(); }
        cursor.style.display = 'none'; pill.textContent = 'ไม่เห็นมือ'; updateHover(-1,-1);
      }
    }
  }
  requestAnimationFrame(handLoop);
}
function updateHover(x,y){
  const el = x < 0 ? null : document.elementFromPoint(x,y);
  const h = el ? el.closest('.btn,[data-drag]') : null;
  if(h !== hoverEl){ if(hoverEl) hoverEl.classList.remove('hover'); hoverEl = h; if(h) h.classList.add('hover'); }
}

/* ===== กระดาน (รอบขอบจอ จัดตามทิศทางจออัตโนมัติ) ===== */
const board = $('board'), token = $('token');
const SQUARES = 20;
let COLS = 7, ROWS = 5;
function setGrid(){ if(VP.h > VP.w){ COLS = 5; ROWS = 7; } else { COLS = 7; ROWS = 5; } }
function sqPos(i){
  const C = COLS, R = ROWS;
  if(i < C) return {c:i, r:0};
  i -= C; if(i < R-2) return {c:C-1, r:i+1};
  i -= R-2; if(i < C) return {c:C-1-i, r:R-1};
  i -= C; return {c:0, r:R-2-i};
}
/* ขนาดพื้นที่ที่มองเห็นจริง (กันล้นจอบนมือถือ เมื่อแถบที่อยู่เว็บโผล่ หรือหน้าถูกซูม) */
const VP = {x:0, y:0, w:innerWidth, h:innerHeight};
function fitViewport(){
  const v = window.visualViewport;
  VP.w = v ? v.width : innerWidth; VP.h = v ? v.height : innerHeight;
  VP.x = v ? v.offsetLeft : 0;    VP.y = v ? v.offsetTop : 0;
  const r = document.documentElement.style;
  r.setProperty('--aw', VP.w+'px'); r.setProperty('--ah', VP.h+'px');
  r.setProperty('--ax', VP.x+'px'); r.setProperty('--ay', VP.y+'px');
  if(typeof layoutBoard === 'function') layoutBoard();
}
const FLAG = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M10 36 V5" stroke="#2d3b3a" stroke-width="3" stroke-linecap="round"/><path d="M11 6 H32 L27 13 L32 20 H11 Z" fill="#e24b4a" stroke="#2d3b3a" stroke-width="2.2" stroke-linejoin="round"/></svg>';

const DICE_DOTS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function setDice(n){ $('dice').innerHTML = n ? Array.from({length:9},(_,k)=>`<i class="${DICE_DOTS[n].includes(k)?'on':''}"></i>`).join('') : '<b>?</b>'; }
function confetti(){

function buildBoard(){
  board.querySelectorAll('.sq').forEach(s=>s.remove());
  for(let i=0;i<SQUARES;i++){
    const st = STATIONS.find(s=>s.sq===i);
    const d = document.createElement('div');

function layoutBoard(){
  setGrid();
  for(let i=0;i<SQUARES;i++){
    const el = $('sq'+i); if(!el) continue;
    const {c,r} = sqPos(i);
    Object.assign(el.style, {left:(c/COLS*100)+'%', top:(r/ROWS*100)+'%', width:(100/COLS)+'%', height:(100/ROWS)+'%'});
  }
  Object.assign($('center').style, {left:(100/COLS)+'%', top:(100/ROWS)+'%', width:((COLS-2)/COLS*100)+'%', height:((ROWS-2)/ROWS*100)+'%'});

function placeToken(i){ token.classList.remove('hop'); void token.offsetWidth; token.classList.add('hop'); const {c,r} = sqPos(i); token.style.left = ((c+.5)/COLS*100)+'%'; token.style.top = ((r+.5)/ROWS*100)+'%'; }

function updateProgress(){

}
async function roll(){
  if(rolling) return; rolling = true;
  $('btnRoll').style.display = 'none';
  const dice = $('dice'); dice.classList.add('roll');
  for(let k=0;k<12;k++){ setDice(1+Math.floor(Math.random()*6)); await sleep(70); }
  dice.classList.remove('roll');
  const n = 1+Math.floor(Math.random()*6); setDice(n);
  await sleep(400);
  for(let k=0;k<n;k++){ G.pos = (G.pos+1)%SQUARES; placeToken(G.pos); await sleep(260); }
  const isTarget = p => STATIONS.some(s=>s.sq===p && s.ready && !G.played.includes(s.id));
  while(!isTarget(G.pos)){ G.pos = (G.pos+1)%SQUARES; placeToken(G.pos); await sleep(180); }
  await sleep(500);
  rolling = false;
  openStation(STATIONS.find(s=>s.sq===G.pos));
}

  $('resetIn').textContent = `กลับหน้าแรกอัตโนมัติใน ${left} วินาที`;
  clearInterval(resetTimer);
  resetTimer = setInterval(()=>{ left--; $('resetIn').textContent = `กลับหน้าแรกอัตโนมัติใน ${left} วินาที`; if(left<=0) resetToStart(); }, 1000);
}
function resetToStart(){
  clearInterval(resetTimer); clearInterval(timerId); timerId = null; onDrop = null; cancelDrag(); rolling = false;
  show('start');
}

/* ===== ปุ่ม ===== */
$('btnCam').onclick = startCamera;
$('btnMouse').onclick = newGame;
$('btnGo').onclick = newGame;
$('btnRoll').onclick = roll;
$('btnAgain').onclick = () => { clearInterval(resetTimer); newGame(); };
fitViewport();
</script>
